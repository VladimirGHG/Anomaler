[project]
name = "anomaler"
version = "0.1.0"
description = ""
authors = [
    {name = "Vladimir Gharagulyan",email = "vladimirgharagulyan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib (==1.5.3)",
    "numpy (==1.26.4)",
    "pandas (==2.3.3)",
    "python-dateutil (==2.9.0.post0)",
    "pytz (==2026.1.post1)",
    "pyzmq (==27.1.0)",
    "river (==0.21.2)",
    "scikit-learn (==1.6.1)",
    "scipy (==1.13.1)",
    "six (==1.17.0)",
    "threadpoolctl (==3.6.0)",
    "tzdata (==2025.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.2.0,<3.0.0)"
]

[tool.poetry]
package-mode = false